services:
  - type: web
    name: nodjunta-pay-api
    runtime: node
    plan: starter
    buildCommand: npm install --include=dev && npm run build:api
    startCommand: npm run start -w apps/api
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: NODE_ENV
        value: production
      - key: DEFAULT_CURRENCY
        value: XOF
      - key: LOG_LEVEL
        value: info
      - key: CORS_ORIGINS
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: PIN_PEPPER
        sync: false
      - key: EXPO_ACCESS_TOKEN
        sync: false

  - type: cron
    name: nodjunta-pay-reconcile
    runtime: node
    plan: starter
    schedule: "0 3 * * *"
    buildCommand: npm install --include=dev && npm run build:api
    startCommand: npm run reconcile -w apps/api
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: NODE_ENV
        value: production
      - key: DEFAULT_CURRENCY
        value: XOF
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: PIN_PEPPER
        sync: false

  - type: web
    name: nodjunta-pay-admin
    runtime: static
    buildCommand: cd apps/admin && npm install --include=dev && npm run build
    staticPublishPath: apps/admin/dist
    headers:
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: no-referrer
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: VITE_API_URL
        sync: false
      - key: VITE_SUPABASE_URL
        sync: false
      - key: VITE_SUPABASE_ANON_KEY
        sync: false
